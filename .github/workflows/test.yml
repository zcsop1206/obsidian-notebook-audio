name: Test

# Builds, runs the unit tests and the Playwright recorder suite (headless Chromium, fake mic)
# on every push and pull request.
on:
  push:
    branches: ['main']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: npm test
